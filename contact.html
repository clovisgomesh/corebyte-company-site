<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato | CoreByte Tech Solutions</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- Header e Menu Padronizado com Hambúrguer -->
    <header style="background-color: #111; padding: 20px 0; border-bottom: 1px solid #222;">
        <div class="container" style="display: flex; justify-content: space-between; align-items: center; max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <h1 class="logo" style="color: #fff; font-size: 24px; margin: 0;">CoreByte</h1>
            
            <!-- Botão do Menu Hambúrguer (Aparece apenas no mobile) -->
            <button id="menu-toggle" aria-label="Abrir Menu" style="background: none; border: none; cursor: pointer; display: none; flex-direction: column; gap: 5px;">
                <span style="width: 25px; height: 3px; background-color: #fff; display: block; border-radius: 2px;"></span>
                <span style="width: 25px; height: 3px; background-color: #fff; display: block; border-radius: 2px;"></span>
                <span style="width: 25px; height: 3px; background-color: #fff; display: block; border-radius: 2px;"></span>
            </button>

            <nav>
                <ul class="menu" id="menu" style="list-style: none; display: flex; gap: 20px; margin: 0; padding: 0;">
                    <li><a href="index.html" style="color: #bbb; text-decoration: none;">Home</a></li>
                    <li><a href="about.html" style="color: #bbb; text-decoration: none;">Sobre</a></li>
                    <li><a href="services.html" style="color: #bbb; text-decoration: none;">Serviços</a></li>
                    <li><a href="courses.html" style="color: #bbb; text-decoration: none;">Cursos</a></li>
                    <li><a href="contact.html" class="active" style="color: #fff; text-decoration: none; font-weight: bold;">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Conteúdo da Página de Contato -->
    <main class="container py-5" style="max-width: 1200px; margin: 40px auto; padding: 0 20px; color: #ddd;">
        <section class="contact-section" style="max-width: 700px; margin: 0 auto;">
            <h2 style="color: #fff; font-size: 32px; margin-bottom: 20px;">Entre em Contato</h2>
            <p style="line-height: 1.6; margin-bottom: 30px; color: #8b949e;">Tem algum projeto em mente ou quer saber mais sobre nossos cursos e serviços? Mande uma mensagem para nossa equipe!</p>
            
            <form class="contact-form" style="background-color: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d;">
                <div style="margin-bottom: 20px;">
                    <label for="name" style="display: block; margin-bottom: 8px; color: #fff; font-weight: bold;">Seu Nome:</label>
                    <input type="text" id="name" name="name" placeholder="Digite seu nome completo" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 20px;">
                    <label for="email" style="display: block; margin-bottom: 8px; color: #fff; font-weight: bold;">Seu E-mail:</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; box-sizing: border-box;">
                </div>
                
                <div style="margin-bottom: 25px;">
                    <label for="message" style="display: block; margin-bottom: 8px; color: #fff; font-weight: bold;">Mensagem:</label>
                    <textarea id="message" name="message" rows="5" placeholder="Como podemos te ajudar?" style="width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #30363d; background-color: #0d1117; color: #fff; box-sizing: border-box; resize: vertical;"></textarea>
                </div>
                
                <button type="submit" style="background-color: #238636; color: white; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; transition: background-color 0.2s;">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer style="background-color: #111; padding: 20px 0; text-align: center; color: #888; border-top: 1px solid #222; margin-top: 60px;">
        <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <p>&copy; 2026 CoreByte Tech Solutions. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>
</html>
